name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q launcher.py main.py minescript tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  worldgen-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact seed regeneration against independent Mojang server world
        env:
          F3PLUS_RUN_MOJANG_WORLDGEN: '1'
          F3PLUS_WORLDGEN_TEST_VERSION: '26.3-snapshot-6'
        run: python -m unittest discover -s tests -p 'test_seed_worldgen_integration.py' -v

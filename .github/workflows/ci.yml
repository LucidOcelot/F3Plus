name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYNPUT_BACKEND: dummy

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify runtime imports
        run: python -c "import PySide6, pynput, pyperclip; print('runtime imports ok')"
      - name: Compile Python sources
        run: python -m compileall -q launcher.py main.py updater.py minescript tests
      - name: Run regression tests
        env:
          F3PLUS_SKIP_UPDATE: '1'
        run: python -m unittest discover -s tests -v

  release-audit:
    name: F3+ release consistency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify release metadata, launchers, docs, and download identities
        env:
          F3PLUS_SKIP_UPDATE: '1'
        run: python -m unittest discover -s tests -p 'test_release_audit.py' -v

  semantic-audit:
    name: Canonical workbench audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify alias coverage and distinct workbench operations
        env:
          F3PLUS_SKIP_UPDATE: '1'
        run: python -m unittest discover -s tests -p 'test_workbench_semantics.py' -v

  worldgen-integration:
    name: Mojang worldgen integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify exact seed regeneration against independent Mojang server world
        env:
          F3PLUS_SKIP_UPDATE: '1'
          F3PLUS_RUN_MOJANG_WORLDGEN: '1'
          F3PLUS_WORLDGEN_TEST_VERSION: '26.3-snapshot-7'
        run: python -m unittest discover -s tests -p 'test_seed_worldgen_integration.py' -v

[project]
name = "f3plus-desktop"
version = "2.4.1"
description = "Cross-platform technical Minecraft Java companion for automation, navigation, seed/RNG analysis, world inspection, and planning."
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6-Essentials==6.9.3",
  "pynput==1.8.2",
  "pyperclip==1.11.0",
  "pyobjc-framework-Quartz==12.2.1; sys_platform == 'darwin'",
]

[project.scripts]
f3plus = "minescript.entrypoint:main"

[tool.uv]
package = false
